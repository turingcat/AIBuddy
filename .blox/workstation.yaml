# The ACP endpoint binds 0.0.0.0, so it requires a secret key; a random one is
# generated and printed per launch unless HEYBUDDY_SERVER__SECRET_KEY is set.
run:
  - name: ACP Server
    command: 'export HEYBUDDY_SERVER__SECRET_KEY="${HEYBUDDY_SERVER__SECRET_KEY:-$(openssl rand -hex 32)}"; echo "ACP secret key: $HEYBUDDY_SERVER__SECRET_KEY"; exec heybuddy serve --platform desktop --host 0.0.0.0 --port 3284'
    port: 3284
