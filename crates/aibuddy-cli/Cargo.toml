[package]
name = "aibuddy-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[[bin]]
name = "aibuddy"
path = "src/main.rs"

[[bin]]
name = "generate_manpages"
path = "src/bin/generate_manpages.rs"

[[bin]]
name = "mcp_conformance_driver"
path = "src/bin/mcp_conformance_driver.rs"

[dependencies]
clap_mangen = { version = "0.3", default-features = false }
aibuddy = { path = "../aibuddy", default-features = false }
agent-client-protocol = { workspace = true, features = ["unstable"], optional = true }
aibuddy-mcp = { path = "../aibuddy-mcp", default-features = false }
aibuddy-providers = { path = "../aibuddy-providers", default-features = false }
aibuddy-roaming = { path = "../aibuddy-roaming", optional = true }
rmcp = { workspace = true }
clap = { workspace = true }
cliclack = { version = "0.5", default-features = false }
console = { version = "0.16", default-features = false, features = ["std"] }
dotenvy = { workspace = true }
bat = { version = "0.26", default-features = false, features = ["regex-onig"] }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
strum = { workspace = true }
strsim = "0.11"
tempfile = { workspace = true }
etcetera = { workspace = true }
rand = { workspace = true }
rustyline = { version = "18", default-features = false, features = ["custom-bindings", "with-dirs", "with-file-history"] }
tracing = { workspace = true }
chrono = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "time"] }
shlex = { version = "2.0", default-features = false, features = ["std"] }
async-trait = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
tar = { version = "0.4.46", default-features = false }
reqwest = { workspace = true, features = ["blocking"] }
zip = { workspace = true }
bzip2 = { version = "0.6", default-features = false, features = ["default"] }
webbrowser = { workspace = true }
indicatif = { version = "0.18", default-features = false }
tokio-util = { workspace = true, features = ["compat", "rt"] }
anstream = { version = "1", default-features = false, features = ["auto"] }
open = { version = "5", default-features = false }
url = { workspace = true }
urlencoding = { workspace = true }
clap_complete = { version = "4", default-features = false }
comfy-table = { version = "8", default-features = false }
sha2 = { workspace = true }
sigstore-verify = { version = "0.11", default-features = false, optional = true }
snap = { workspace = true, optional = true }
axum.workspace = true
axum-server = { workspace = true, optional = true }
clap_complete_nushell = { version = "4", default-features = false }
qrcode = { version = "0.14.1", optional = true }
fs2 = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
anstream = { version = "1", default-features = false, features = ["wincon"] }
ntapi = { version = "0.4.3", default-features = false, features = ["user"] }
winapi = { workspace = true, features = [
    "consoleapi",
    "processenv",
    "winbase",
    "wincon",
] }

[target."cfg(unix)".dependencies]
libc = { version = "0.2.182", default-features = false, features = ["std"] }

[features]
default = [
    "code-mode",
    "local-inference",
    "aws-providers",
    "nostr",
    "otel",
    "rustls-tls",
    "system-keyring",
    "update",
]
roaming = ["dep:aibuddy-roaming", "dep:qrcode", "dep:fs2", "dep:agent-client-protocol"]
code-mode = ["aibuddy/code-mode"]
local-inference = ["aibuddy/local-inference"]
aws-providers = ["aibuddy/aws-providers"]
cuda = ["aibuddy/cuda", "local-inference"]
vulkan = ["aibuddy/vulkan", "local-inference"]
mlx = ["aibuddy/mlx", "local-inference"]
nostr = ["aibuddy/nostr"]
otel = ["aibuddy/otel"]
system-keyring = ["aibuddy/system-keyring"]
update = ["dep:sigstore-verify", "dep:snap"]
portable-default = ["rustls-tls", "aws-providers", "otel"]
# disables the update command
disable-update = []
rustls-tls = [
    "dep:axum-server",
    "reqwest/rustls",
    "axum-server/tls-rustls",
    "sigstore-verify?/rustls",
    "aibuddy/rustls-tls",
    "aibuddy-mcp/rustls-tls",
    "aibuddy-providers/rustls-tls",
]
native-tls = [
    "dep:axum-server",
    "reqwest/native-tls",
    "axum-server/tls-openssl",
    "sigstore-verify?/native-tls",
    "aibuddy/native-tls",
    "aibuddy-mcp/native-tls",
    "aibuddy-providers/native-tls",
]
[dev-dependencies]
env-lock.workspace = true
tempfile = { workspace = true }
test-case = { workspace = true }
tokio = { workspace = true }

[package.metadata.cargo-machete]
ignored = [
    # Used only in windows
    "winapi",
]
