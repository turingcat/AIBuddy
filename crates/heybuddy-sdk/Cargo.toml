[package]
name = "heybuddy-sdk"
version = "0.1.0-alpha.6"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The heybuddy Development Kit (GDK) for Rust, with optional uniffi bindings for Python/Kotlin"

[lib]
name = "heybuddy_sdk"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "heybuddy-uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]

[features]
default = []
uniffi = [
    "dep:uniffi",
    "dep:heybuddy-context-management",
    "dep:thiserror",
    "dep:anyhow",
    "dep:heybuddy-providers",
    "dep:futures",
    "dep:serde_json",
    "dep:tokio",
    "dep:rmcp",
    "dep:base64",
]

[dependencies]
heybuddy-sdk-types = { version = "0.1.0-alpha.6", path = "../heybuddy-sdk-types" }
agent-client-protocol = { workspace = true }
agent-client-protocol-schema = { workspace = true }

uniffi = { version = "0.32", features = ["cli"], optional = true }
thiserror = { version = "2", optional = true }
heybuddy-providers = { version = "0.1.0-alpha.6", path = "../heybuddy-providers", features = ["rustls-tls"], optional = true }
heybuddy-context-management = { version = "0.1.0-alpha.6", path = "../heybuddy-context-management", optional = true }
futures = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"], optional = true }
anyhow = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-std", "io-util"] }
tokio-util = { workspace = true, features = ["compat", "rt"] }

[package.metadata.cargo-machete]
# Used to provide extras imports for agent-client-protocol
ignored = ["agent-client-protocol-schema"]
