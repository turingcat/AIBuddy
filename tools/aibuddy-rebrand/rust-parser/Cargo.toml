[package]
name = "rust-parser"
version = "0.1.0"
edition = "2021"

[dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
rustc_lexer = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "3.0.5", features = ["full", "visit"] }

[workspace]
