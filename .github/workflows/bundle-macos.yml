on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'Whether to perform signing and notarization'
        required: false
        default: false
        type: boolean
      artifact_retention_days:
        description: 'Days to retain final build artifacts'
        required: false
        default: 7
        type: number
  workflow_call:
    inputs:
      version:
        description: 'Version to set for the build'
        required: false
        default: ""
        type: string
      signing:
        description: 'Whether to perform signing and notarization'
        required: false
        default: false
        type: boolean
      environment:
        description: 'GitHub Environment containing signing secrets. Leave empty for unsigned builds.'
        required: false
        default: ''
        type: string
      ref:
        description: 'Git ref to checkout (branch, tag, or SHA). Defaults to main branch if not specified.'
        required: false
        type: string
        default: ''
      artifact_retention_days:
        description: 'Days to retain final build artifacts'
        required: false
        default: 7
        type: number

concurrency:
  group: bundle-macos-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

name: "Bundle Desktop (macOS ARM64)"

env:
  MACOS_TARGET: aarch64-apple-darwin

jobs:
  build-aibuddy:
    name: Build AIBuddy (macOS ARM64)
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    permissions:
      contents: read
    steps:
      - name: Debug workflow info
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SIGNING: ${{ inputs.signing }}
        run: |
          echo "=== Workflow Information ==="
          echo "Workflow: ${WORKFLOW_NAME}"
          echo "Ref: ${WORKFLOW_REF}"
          echo "Event: ${EVENT_NAME}"
          echo "Repo: ${REPOSITORY}"
          echo ""
          echo "=== Input Parameters ==="
          echo "Build ref: ${INPUT_REF:-<default branch>}"
          echo "Version: ${INPUT_VERSION:-not set}"
          echo "Target: ${MACOS_TARGET}"
          echo "Signing: ${INPUT_SIGNING:-false}"

      - name: Check initial disk space
        run: df -h

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || '' }}

      - name: Debug git status
        run: |
          echo "=== Git Status ==="
          git status
          echo ""
          echo "=== Current Commit ==="
          git rev-parse HEAD
          git rev-parse --abbrev-ref HEAD
          echo ""
          echo "=== Recent Commits ==="
          git log --oneline -n 5
          echo ""
          echo "=== Remote Branches ==="
          git branch -r

      - name: Update Cargo version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/set-cargo-version.sh "$VERSION"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: bundle-macos-aarch64-apple-darwin-deployment-target-12

      - name: Build aibuddy
        run: |
          source ./bin/activate-hermit
          rustup target add "$MACOS_TARGET"
          cargo build --release -p aibuddy-cli --bin aibuddy --target "$MACOS_TARGET"

      - name: Prepare binary artifact
        run: |
          mkdir -p artifacts
          cp "target/${MACOS_TARGET}/release/aibuddy" "artifacts/internal-aibuddy-${MACOS_TARGET}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: internal-aibuddy-aarch64-apple-darwin
          path: artifacts/internal-aibuddy-aarch64-apple-darwin
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  package-desktop:
    name: Package Desktop (macOS ARM64)
    needs: build-aibuddy
    runs-on: macos-latest
    environment: ${{ inputs.environment || '' }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
    permissions:
      contents: read
    outputs:
      artifact-url: ${{ steps.upload-app-bundle.outputs.artifact-url }}
    steps:
      - name: Check initial disk space
        run: df -h

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || '' }}

      - name: Update desktop version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          source ./bin/activate-hermit
          cd ui/desktop
          npm pkg set "version=${VERSION}"

      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: internal-aibuddy-aarch64-apple-darwin
          path: ui/desktop/src/bin

      - name: Prepare desktop backend
        run: |
          rm -f ui/desktop/src/bin/aibuddy
          mv "ui/desktop/src/bin/internal-aibuddy-${MACOS_TARGET}" ui/desktop/src/bin/aibuddy
          chmod +x ui/desktop/src/bin/aibuddy
          ls -la ui/desktop/src/bin/

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          source ./bin/activate-hermit
          echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v1-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-v1-${{ runner.os }}-

      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-cache-v1-${{ runner.os }}-arm64-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            electron-cache-v1-${{ runner.os }}-arm64-

      - name: Force GitHub HTTPS npm git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "git+ssh://git@github.com/"

      - name: Install dependencies
        run: source ../../bin/activate-hermit && pnpm install --frozen-lockfile
        working-directory: ui/desktop

      - name: Import Apple signing certificate
        if: ${{ inputs.signing }}
        uses: ./.github/actions/apple-codesign
        with:
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Check disk space before bundling
        run: df -h

      - name: Build App
        env:
          APPLE_ID: ${{ inputs.signing && secrets.APPLE_ID || '' }}
          APPLE_ID_PASSWORD: ${{ inputs.signing && secrets.APPLE_ID_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signing && secrets.APPLE_TEAM_ID || '' }}
        run: |
          source ../../bin/activate-hermit
          attempt=0
          max_attempts=2
          until [ $attempt -ge $max_attempts ]; do
            pnpm run bundle:default && break
            attempt=$((attempt + 1))
            echo "Attempt $attempt failed. Retrying..."
            sleep 5
          done
          if [ $attempt -ge $max_attempts ]; then
            echo "Action failed after $max_attempts attempts."
            exit 1
          fi
        working-directory: ui/desktop

      - name: Verify macOS package
        run: pnpm run verify:package -- darwin out/AIBuddy-darwin-arm64
        working-directory: ui/desktop

      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Final cleanup before artifact upload
        run: |
          rm -f ui/desktop/src/bin/aibuddy
          df -h

      - name: Upload Desktop artifact
        id: upload-app-bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: AIBuddy-macos-arm64
          path: ui/desktop/out/AIBuddy-darwin-arm64/AIBuddy.zip
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          overwrite: true

      - name: Quick launch test (macOS)
        env:
          APP_PATH: ui/desktop/out/AIBuddy-darwin-arm64/AIBuddy.app
        run: |
          xattr -cr "$APP_PATH"
          echo "Opening AIBuddy.app..."
          open -g "$APP_PATH"
          sleep 5

          if pgrep -f "AIBuddy.app/Contents/MacOS/AIBuddy" > /dev/null; then
            echo "App appears to be running."
          else
            echo "App did not stay open. Possible crash or startup error."
            exit 1
          fi
          pkill -f "AIBuddy.app/Contents/MacOS/AIBuddy"
