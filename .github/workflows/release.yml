# Build the supported Desktop artifacts and publish tagged releases.
on:
  push:
    paths-ignore:
      - "documentation/**"
    branches:
      - "release/*"
    tags:
      - "v1.*"

name: Release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-macos-arm64:
    uses: ./.github/workflows/bundle-macos.yml
    permissions:
      contents: read
    with:
      artifact_retention_days: 7
      signing: ${{ startsWith(github.ref, 'refs/tags/') && vars.ENABLE_MAC_RELEASE_SIGNING == 'true' }}
      environment: ${{ startsWith(github.ref, 'refs/tags/') && vars.ENABLE_MAC_RELEASE_SIGNING == 'true' && 'signing' || '' }}
    secrets: inherit

  bundle-windows:
    uses: ./.github/workflows/bundle-windows.yml
    permissions:
      contents: read
      actions: read
    with:
      artifact_retention_days: 7

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [bundle-macos-arm64, bundle-windows]
    concurrency:
      group: publish-aibuddy-stable
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Validate stable release version
        shell: bash
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "!internal-*"
          merge-multiple: true

      - name: Attest build provenance
        if: ${{ github.event.repository.owner.type == 'Organization' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            AIBuddy*.zip
            AIBuddy-windows-*-setup.exe

      - name: Release versioned
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            AIBuddy*.zip
            AIBuddy-windows-*-setup.exe
          allowUpdates: true
          omitBody: true
          prerelease: false

      - name: Release stable
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: stable
          name: Stable
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            AIBuddy*.zip
            AIBuddy-windows-*-setup.exe
          allowUpdates: true
          omitBody: true
          prerelease: false

      - name: Upload Windows installers to COS
        shell: bash
        env:
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
        run: bash .github/scripts/upload-windows-installers-to-cos.sh
