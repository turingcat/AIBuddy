name: Repack Windows Desktop Portable

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful workflow run containing the installer artifact'
        required: true
        type: string
        default: '33966581247'
      source_artifact_name:
        description: 'Installer artifact to download from the source run'
        required: true
        type: string
        default: 'Goose-win32-x32'
      architecture:
        description: 'Windows architecture contained in the installer'
        required: true
        type: choice
        options:
          - x32
        default: x32
      artifact_retention_days:
        description: 'Days to retain the portable artifact'
        required: true
        type: number
        default: 90

permissions:
  actions: read
  contents: read

jobs:
  repack:
    name: Repack Windows ${{ inputs.architecture }} portable
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.source_artifact_name }}
          path: source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Install 32-bit Wine runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes wine wine32:i386 xvfb

      - name: Stage and validate portable files
        shell: bash
        env:
          WINEARCH: win32
          WINEPREFIX: ${{ runner.temp }}/wine32
          WINEDEBUG: -all
          WINEDLLOVERRIDES: mscoree,mshtml=
        run: |
          set -euo pipefail
          ARCHITECTURE='${{ inputs.architecture }}'

          mapfile -t installers < <(find source -type f -iname '*-setup.exe')
          if [[ ${#installers[@]} -ne 1 ]]; then
            printf 'Expected one installer, found %s\n' "${#installers[@]}" >&2
            exit 1
          fi

          mkdir -p staged-app
          xvfb-run -a wineboot --init
          wineserver -w

          installer_path="$(winepath -w "${installers[0]}")"
          staging_path="$(winepath -w "$GITHUB_WORKSPACE/staged-app")"
          xvfb-run -a wine "$installer_path" \
            /VERYSILENT \
            /SUPPRESSMSGBOXES \
            /NORESTART \
            /SP- \
            /NOICONS \
            "/DIR=$staging_path"
          wineserver -w
          find staged-app -maxdepth 1 -type f -iname 'unins*' -delete

          executables=(
            'staged-app/HeyBuddy.exe'
            'staged-app/resources/bin/goose.exe'
            'staged-app/resources/bin/uv.exe'
            'staged-app/resources/bin/uvx.exe'
          )
          for executable in "${executables[@]}"; do
            test -s "$executable"
            file_type="$(file -b "$executable")"
            printf '%s: %s (%s bytes)\n' "$executable" "$file_type" "$(stat -c %s "$executable")"

            if [[ "$file_type" != 'PE32 executable'* || "$file_type" == 'PE32+ executable'* ]]; then
              printf 'Executable is not Windows x32: %s: %s\n' "$executable" "$file_type" >&2
              exit 1
            fi
          done

      - name: Create portable archive
        shell: bash
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/HeyBuddy-windows-${ARCHITECTURE}-portable.zip"
          (cd staged-app && zip -r "$archive" .)
          sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256"

      - name: Upload portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: HeyBuddy-windows-${{ inputs.architecture }}-portable
          path: |
            HeyBuddy-windows-${{ inputs.architecture }}-portable.zip
            HeyBuddy-windows-${{ inputs.architecture }}-portable.zip.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          overwrite: true
