name: Repack Windows Desktop Portable

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful workflow run containing the installer artifact'
        required: true
        type: string
        default: '33966581247'
      source_artifact_name:
        description: 'Installer artifact to download from the source run'
        required: true
        type: string
        default: 'Goose-win32-x32'
      architecture:
        description: 'Windows architecture contained in the installer'
        required: true
        type: choice
        options:
          - x32
          - x64
        default: x32
      artifact_retention_days:
        description: 'Days to retain the portable artifact'
        required: true
        type: number
        default: 90

permissions:
  actions: read
  contents: read

jobs:
  repack:
    name: Repack Windows ${{ inputs.architecture }} portable
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.source_artifact_name }}
          path: source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Build Inno Setup extractor
        shell: bash
        env:
          INNOEXTRACT_COMMIT: 376a13e7c41cc5528b6088d0dd16ec1b323a8d37
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            cmake \
            g++ \
            libboost-date-time-dev \
            libboost-filesystem-dev \
            libboost-iostreams-dev \
            libboost-program-options-dev \
            libboost-system-dev \
            libbz2-dev \
            liblzma-dev \
            zlib1g-dev

          git init innoextract-src
          git -C innoextract-src remote add origin https://github.com/dscho/innoextract.git
          git -C innoextract-src fetch --depth=1 origin "$INNOEXTRACT_COMMIT"
          git -C innoextract-src checkout --detach FETCH_HEAD

          cmake \
            -S innoextract-src \
            -B innoextract-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DUSE_LTO=OFF
          cmake --build innoextract-build --parallel 2

          extractor="$(find innoextract-build -type f -name innoextract -perm -111 -print -quit)"
          test -n "$extractor"
          echo "INNOEXTRACT=$extractor" >> "$GITHUB_ENV"
          "$extractor" --version

      - name: Extract and validate installer
        shell: bash
        run: |
          set -euo pipefail
          ARCHITECTURE='${{ inputs.architecture }}'

          mapfile -t installers < <(find source -type f -iname '*-setup.exe')
          if [[ ${#installers[@]} -ne 1 ]]; then
            printf 'Expected one installer, found %s\n' "${#installers[@]}" >&2
            exit 1
          fi

          set +e
          "$INNOEXTRACT" --extract --output-dir extracted "${installers[0]}"
          extract_status=$?
          set -e
          if (( extract_status != 0 )); then
            echo "::warning title=Inno extraction warnings::innoextract exited with status $extract_status; validating extracted files before continuing"
          fi

          executables=(
            'extracted/app/HeyBuddy.exe'
            'extracted/app/resources/bin/goose.exe'
            'extracted/app/resources/bin/uv.exe'
            'extracted/app/resources/bin/uvx.exe'
          )
          for executable in "${executables[@]}"; do
            test -s "$executable"
            file_type="$(file -b "$executable")"
            printf '%s: %s (%s bytes)\n' "$executable" "$file_type" "$(stat -c %s "$executable")"

            case "$ARCHITECTURE" in
              x32)
                if [[ "$file_type" != 'PE32 executable'* || "$file_type" == 'PE32+ executable'* ]]; then
                  printf 'Executable is not Windows x32: %s: %s\n' "$executable" "$file_type" >&2
                  exit 1
                fi
                ;;
              x64)
                if [[ "$file_type" != 'PE32+ executable'* ]]; then
                  printf 'Executable is not Windows x64: %s: %s\n' "$executable" "$file_type" >&2
                  exit 1
                fi
                ;;
            esac
          done

      - name: Create portable archive
        shell: bash
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/HeyBuddy-windows-${ARCHITECTURE}-portable.zip"
          (cd extracted/app && zip -r "$archive" .)
          sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256"

      - name: Upload portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: HeyBuddy-windows-${{ inputs.architecture }}-portable
          path: |
            HeyBuddy-windows-${{ inputs.architecture }}-portable.zip
            HeyBuddy-windows-${{ inputs.architecture }}-portable.zip.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          overwrite: true
