# Build the supported Desktop artifacts on demand.
on:
  workflow_dispatch:

name: Canary

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-version:
    name: Prepare Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Generate a canary version
        id: set-version
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          VERSION=$(grep '^version\s*=' Cargo.toml | head -n 1 | cut -d\" -f2)
          echo "version=${VERSION}-canary+${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  bundle-macos-arm64:
    needs: [prepare-version]
    uses: ./.github/workflows/bundle-macos.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.prepare-version.outputs.version }}
      artifact_retention_days: 7
      signing: false

  bundle-windows:
    needs: [prepare-version]
    uses: ./.github/workflows/bundle-windows.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.prepare-version.outputs.version }}
      artifact_retention_days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [bundle-macos-arm64, bundle-windows]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: '!internal-*'
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            AIBuddy*.zip
            AIBuddy*.exe

      - name: Release canary
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          tag: canary
          name: Canary
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            AIBuddy*.zip
            AIBuddy*.exe
          allowUpdates: true
          omitBody: true
          omitPrereleaseDuringUpdate: true
