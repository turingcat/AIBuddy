name: "Bundle CLI and Desktop (Windows)"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to set for the build'
        required: false
        type: string
        default: ''
      package_cli:
        description: 'Whether to package and upload the CLI artifact'
        required: false
        type: boolean
        default: false
      package_desktop:
        description: 'Whether to package and upload the Desktop artifact'
        required: false
        type: boolean
        default: false
      windows_variant:
        description: 'Windows artifact variant: standard or cuda'
        required: false
        type: choice
        options:
          - standard
          - cuda
        default: 'standard'
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        required: false
        type: string
      package_cli:
        description: 'Whether to package and upload the CLI artifact'
        required: false
        type: boolean
        default: false
      package_desktop:
        description: 'Whether to package and upload the Desktop artifact'
        required: false
        type: boolean
        default: false
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      windows_variant:
        description: 'Windows artifact variant: standard or cuda'
        required: false
        type: string
        default: 'standard'

permissions:
  contents: read

jobs:
  build-goose-windows:
    name: Build Goose (Windows)
    runs-on: ${{ inputs.windows_variant == 'cuda' && 'windows-2022' || 'windows-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || '' }}

      - name: Update Cargo version
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/set-cargo-version.sh "$VERSION"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: windows-msvc-desktop-${{ inputs.windows_variant }}

      - name: Setup Rust
        shell: bash
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc

      - name: Install CUDA toolkit
        if: ${{ inputs.windows_variant == 'cuda' }}
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d  # v0.2.36
        with:
          cuda: '12.9.1'
          method: 'local'
          log-file-suffix: 'bundle-windows-cuda.txt'

      - name: Set up MSVC developer environment
        if: ${{ inputs.windows_variant == 'cuda' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64

      - name: Verify CUDA toolchain
        if: ${{ inputs.windows_variant == 'cuda' }}
        shell: pwsh
        env:
          CUDA_COMPUTE_CAP: "80"
        run: |
          Write-Output "CUDA_PATH=$env:CUDA_PATH"
          Write-Output "CUDA_COMPUTE_CAP=$env:CUDA_COMPUTE_CAP"
          where.exe cl
          where.exe nvcc
          nvcc -V

      - name: Build Windows executable
        shell: pwsh
        env:
          CUDA_COMPUTE_CAP: ${{ inputs.windows_variant == 'cuda' && '80' || '' }}
        run: |
          $isCuda = "${{ inputs.windows_variant }}" -eq "cuda"

          if ($isCuda) {
            cargo build --release --target x86_64-pc-windows-msvc -p goose-cli --bin goose --features cuda
          } else {
            cargo build --release --target x86_64-pc-windows-msvc -p goose-cli --bin goose
          }

          $binaryPath = "./target/x86_64-pc-windows-msvc/release/goose.exe"
          if (-not (Test-Path $binaryPath)) {
            Write-Error "Windows binary not found: $binaryPath"
            Get-ChildItem ./target/x86_64-pc-windows-msvc/release/ -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Item $binaryPath

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: internal-goose-x86_64-pc-windows-msvc${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: target/x86_64-pc-windows-msvc/release/goose.exe
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  package-cli-windows:
    name: Package CLI (Windows)
    if: ${{ inputs.package_cli }}
    needs: build-goose-windows
    runs-on: ${{ inputs.windows_variant == 'cuda' && 'windows-2022' || 'windows-latest' }}
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: internal-goose-x86_64-pc-windows-msvc${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: package

      - name: Package CLI
        shell: bash
        env:
          VARIANT_SUFFIX: ${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
        run: |
          mkdir -p goose-package
          cp package/goose.exe goose-package/
          7z a -tzip "goose-x86_64-pc-windows-msvc${VARIANT_SUFFIX}.zip" goose-package/

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: goose-x86_64-pc-windows-msvc${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: goose-x86_64-pc-windows-msvc${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}.zip
          if-no-files-found: error
          overwrite: true

  build-desktop-windows:
    name: Build Desktop (Windows)
    if: ${{ inputs.package_desktop }}
    needs: build-goose-windows
    runs-on: ${{ inputs.windows_variant == 'cuda' && 'windows-2022' || 'windows-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.10.0

      - name: Update desktop version
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd ui/desktop
          npm pkg set "version=${VERSION}"

      - name: Install pnpm
        run: npm install -g pnpm@10.30.3

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            ui/desktop/node_modules
            .hermit/node/cache
          key: windows-pnpm-cache-v1-${{ runner.os }}-node24-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            windows-pnpm-cache-v1-${{ runner.os }}-node24-

      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: internal-goose-x86_64-pc-windows-msvc${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: backend

      - name: Prepare Windows binary
        shell: bash
        run: |
          rm -rf ./ui/desktop/src/bin
          mkdir -p ./ui/desktop/src/bin
          cp -f ./backend/goose.exe ./ui/desktop/src/bin/

          if [ -d "./ui/desktop/src/platform/windows/bin" ]; then
            for file in ./ui/desktop/src/platform/windows/bin/*.{exe,dll,cmd}; do
              filename="$(basename "$file")"
              if [ -f "$file" ] && [ "$filename" != "goose.exe" ]; then
                cp -f "$file" ./ui/desktop/src/bin/
              fi
            done

            if [ -d "./ui/desktop/src/platform/windows/bin/goose-npm" ]; then
              cp -r ./ui/desktop/src/platform/windows/bin/goose-npm/ ./ui/desktop/src/bin/goose-npm/
            fi
          fi

      - name: Force GitHub HTTPS for npm git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"

      - name: Build desktop UI with pnpm
        shell: bash
        env:
          ELECTRON_PLATFORM: win32
        run: |
          cd ui/desktop
          pnpm install --frozen-lockfile
          node scripts/build-main.js
          node scripts/prepare-platform-binaries.js
          pnpm run make --platform=win32 --arch=x64

      - name: Prepare flat distribution
        shell: bash
        run: |
          cd ui/desktop
          packaged="out/$(node -p "require('./scripts/windows-package').resolveWindowsPackage('0.0.0', '.', '.').packagedDirName")"
          mkdir -p "$packaged/resources/bin"
          cp -r src/bin/* "$packaged/resources/bin/"

          mkdir -p ./dist-windows
          cp -r "$packaged"/* ./dist-windows/

          ls -la ./dist-windows/
          ls -la ./dist-windows/resources/bin/

      - name: Upload unsigned distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: internal-windows-unsigned${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: ui/desktop/dist-windows/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  package-desktop-windows:
    name: Package Desktop (Windows)
    needs: build-desktop-windows
    if: ${{ inputs.package_desktop }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || '' }}

      - name: Download unsigned distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: internal-windows-unsigned${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: ui/desktop/dist-windows

      - name: Set up Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create Windows installer
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION
          if (-not $version) {
            $package = Get-Content "ui/desktop/package.json" -Raw | ConvertFrom-Json
            $version = $package.version
          }
          $outputDir = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force $outputDir | Out-Null
          $distDir = Join-Path $env:GITHUB_WORKSPACE "ui\desktop\dist-windows"
          $pkg = & node "ui/desktop/scripts/windows-package.js" $version $distDir $outputDir | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Failed to resolve Windows package definitions" }
          & $env:ISCC_PATH @($pkg.isccArgs) "ui/desktop/desktop-setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $installer = Join-Path $outputDir $pkg.setupFileName
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          Get-Item $installer

      - name: Create Windows zip package
        id: package-windows-zip
        working-directory: ui/desktop/dist-windows
        shell: bash
        env:
          VARIANT_SUFFIX: ${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
        run: |
          portable_file_name="$(node -p "require('../scripts/windows-package').resolveWindowsPackage('0.0.0', '.', '.').portableFileName")"
          portable_file_name="${portable_file_name%.zip}${VARIANT_SUFFIX}.zip"
          7z a -tzip "$GITHUB_WORKSPACE/$portable_file_name" ./*
          echo "portable_file_name=$portable_file_name" >> "$GITHUB_OUTPUT"

      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Goose-win32-x64${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
        path: |
          ${{ steps.package-windows-zip.outputs.portable_file_name }}
          AIBuddy-windows-x64-setup.exe
          if-no-files-found: error
          overwrite: true
