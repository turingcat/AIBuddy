name: Model Tool Call Conformance

# Sweeps many models and reports which ones can actually drive an MCP tool call
# through aibuddy. This is deliberately NOT a PR gate: it exercises third-party
# models over the network, so a failure here usually means a provider or model
# regressed, not that a aibuddy change broke. Running it on a schedule keeps the
# signal without turning unrelated PRs red.
on:
  schedule:
    # 03:00 UTC daily
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      model_count:
        description: 'Number of top OpenRouter tool-capable models to test'
        required: false
        default: '10'
        type: string
      models:
        description: 'Comma-separated explicit model list (overrides model_count)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  openrouter-toolcalls:
    name: OpenRouter Tool Calls
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: model-toolcall-conformance
          save-if: ${{ github.ref == 'refs/heads/main' && job.status == 'success' }}

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libdbus-1-dev gnome-keyring libxcb1-dev jq

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Build Binary
        run: cargo build --locked --bin aibuddy

      - name: Run OpenRouter Tool Call Sweep
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HOME: /tmp/aibuddy-home
          AIBUDDY_DISABLE_KEYRING: 1
          SKIP_BUILD: 1
          AIBUDDY_BIN: ${{ github.workspace }}/target/debug/aibuddy
        run: |
          mkdir -p /tmp/aibuddy-home
          if [ -n "${{ inputs.models }}" ]; then
            bash scripts/test_openrouter_toolcalls.sh \
              --models "${{ inputs.models }}" \
              --output-dir openrouter-toolcall-results
          else
            bash scripts/test_openrouter_toolcalls.sh \
              --count "${{ inputs.model_count || '10' }}" \
              --output-dir openrouter-toolcall-results
          fi

      - name: Upload Per-Model Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: openrouter-toolcall-logs
          path: openrouter-toolcall-results
          retention-days: 14
