# Windows desktop CI on Azure Pipelines for the private GitHub repository.
# Uses Microsoft-hosted Windows agents and does not consume GitHub Actions minutes.

trigger: none
pr: none

parameters:
  - name: architecture
    displayName: Windows architecture
    type: string
    default: both
    values:
      - both
      - x32
      - x64

jobs:
  - ${{ if or(eq(parameters.architecture, 'both'), eq(parameters.architecture, 'x32')) }}:
    - job: build_windows_x32
      displayName: Build Windows x32
      pool:
        vmImage: windows-2022
      variables:
        ARTIFACT_ARCH: x32
        ELECTRON_ARCH: ia32
        RUST_TARGET: i686-pc-windows-msvc
        CARGO_FEATURES: aws-providers,nostr,otel,rustls-tls,system-keyring
      steps:
        - template: .azure-pipelines/windows-desktop-steps.yml

  - ${{ if or(eq(parameters.architecture, 'both'), eq(parameters.architecture, 'x64')) }}:
    - job: build_windows_x64
      displayName: Build Windows x64
      ${{ if eq(parameters.architecture, 'both') }}:
        dependsOn: build_windows_x32
      pool:
        vmImage: windows-2022
      variables:
        ARTIFACT_ARCH: x64
        ELECTRON_ARCH: x64
        RUST_TARGET: x86_64-pc-windows-msvc
        CARGO_FEATURES: code-mode,aws-providers,nostr,otel,rustls-tls,system-keyring,update
      steps:
        - template: .azure-pipelines/windows-desktop-steps.yml
