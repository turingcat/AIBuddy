# Windows CI on Azure Pipelines for the private GitHub repository.
# Uses Microsoft-hosted Windows agents and does not consume GitHub Actions minutes.

trigger: none
pr: none

pool:
  vmImage: windows-2022

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - powershell: |
      Write-Host "Agent OS: $env:AGENT_OS"
      Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
      rustup show
      rustup target add x86_64-pc-windows-msvc
    displayName: Prepare Windows Rust toolchain

  - task: Cache@2
    displayName: Cache Cargo registry and Git dependencies
    inputs:
      key: 'cargo | "$(Agent.OS)" | Cargo.lock'
      restoreKeys: |
        cargo | "$(Agent.OS)"
      path: $(UserProfile)\.cargo

  - powershell: |
      $env:CARGO_INCREMENTAL = "0"
      cargo build --locked -p goose-cli --bin goose --target x86_64-pc-windows-msvc
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      $binary = "target\x86_64-pc-windows-msvc\debug\goose.exe"
      if (-not (Test-Path $binary)) { throw "Windows binary not found: $binary" }
      New-Item -ItemType Directory -Force "$(Build.ArtifactStagingDirectory)\windows-x64" | Out-Null
      Copy-Item $binary "$(Build.ArtifactStagingDirectory)\windows-x64\goose.exe"
    displayName: Build Windows x64 CLI

  - publish: $(Build.ArtifactStagingDirectory)\windows-x64
    artifact: AIBuddy-windows-x64
    displayName: Publish Windows artifact
